<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0c0b">
<title>Yanbal</title>
<meta name="description" content="Perfumes, maquillaje, tratamiento facial y joyería Yanbal. Precios en bolivianos y su equivalente en pesos argentinos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c0b;--bg2:#161311;--card:#1b1714;--ink:#f3ece4;--mut:#a59a8e;--line:#2d2722;--gold:#c9a96a;--gold2:#e6cf9c;--wa:#25d366}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Jost",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
/* cabecera */
.hero{position:relative;text-align:center;padding:calc(36px + env(safe-area-inset-top)) 20px 28px;background:radial-gradient(120% 90% at 50% 0%,#2a2118 0%,var(--bg) 70%)}
.logo{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(2.6rem,11vw,4.4rem);letter-spacing:.32em;margin:0 0 0 .32em;color:var(--gold2);line-height:1}
.tag{margin:10px 0 0;color:var(--mut);font-weight:300;letter-spacing:.28em;font-size:.72rem;text-transform:uppercase}
.rule{width:56px;height:1px;background:var(--gold);margin:18px auto 14px;opacity:.7}
.fx{display:inline-block;font-size:.8rem;color:var(--mut);letter-spacing:.04em}
.fx b{color:var(--gold2);font-weight:500}
/* barra */
.bar{position:sticky;top:0;z-index:20;background:rgba(14,12,11,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 0 0}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
.tools{display:flex;gap:8px;padding-bottom:10px}
.search{flex:1;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mut)}
input,select{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:11px 16px;width:100%;outline:none;min-height:44px}
input{padding-left:40px}
input:focus,select:focus{border-color:var(--gold)}
select{width:auto;max-width:46%;appearance:none;-webkit-appearance:none;padding-right:16px;text-overflow:ellipsis}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;margin:0 -16px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;border:1px solid var(--line);background:transparent;color:var(--mut);padding:9px 18px;border-radius:999px;font:inherit;font-size:.82rem;letter-spacing:.06em;cursor:pointer;min-height:40px;transition:.2s}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#1a140c;font-weight:500}
/* grilla */
main{max-width:1280px;margin:0 auto;padding:18px 16px 120px}
.count{color:var(--mut);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1260px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,border-color .25s}
@media(hover:hover){.card:hover{transform:translateY(-3px);border-color:#4a3d2a}}
.ph{aspect-ratio:1/1;background:#f4efe9;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.ph.alt{background:var(--bg2)}.ph.alt img{object-fit:cover;mix-blend-mode:normal;opacity:.92}
.body{padding:12px 12px 14px;display:flex;flex-direction:column;flex:1;gap:4px}
.cat{font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.nm{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.08rem;font-weight:600;line-height:1.2;flex:1;overflow-wrap:anywhere}
.prices{margin-top:6px;border-top:1px solid var(--line);padding-top:8px}
.bs{font-size:1.18rem;font-weight:500;color:var(--gold2)}
.old{font-size:.78rem;color:var(--mut);text-decoration:line-through;margin-left:6px}
.ars{font-size:.82rem;color:var(--mut)}.ars b{color:var(--ink);font-weight:500}
.note{display:inline-block;margin-top:6px;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid #4a3d2a;border-radius:999px;padding:2px 9px}
.ask{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);border:1px solid var(--gold);border-radius:999px;padding:9px 8px;min-height:40px;transition:.2s}
.ask:active,.ask:hover{background:var(--gold);color:#1a140c}
.ask svg{width:15px;height:15px;fill:currentColor}
.empty{padding:60px 0;text-align:center;color:var(--mut)}
footer{max-width:1280px;margin:0 auto;padding:10px 16px calc(40px + env(safe-area-inset-bottom));color:var(--mut);font-size:.74rem;line-height:1.6;border-top:1px solid var(--line)}
/* whatsapp flotante */
.wa{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--wa);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 22px rgba(0,0,0,.5);z-index:30;transition:transform .2s}
.wa:active{transform:scale(.94)}
.wa svg{width:32px;height:32px;fill:#fff}
.wa::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--wa);animation:p 2.4s infinite;opacity:0}
@keyframes p{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.55);opacity:0}}
@media(prefers-reduced-motion:reduce){.wa::after{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="hero">
  <h1 class="logo">YANBAL</h1>
  <p class="tag">Perfumes · Maquillaje · Cuidado · Joyería</p>
  <div class="rule"></div>
  <div class="fx" id="fx">&nbsp;</div>
</header>

<div class="bar"><div class="wrap">
  <div class="tools">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Buscar" autocomplete="off" aria-label="Buscar producto"></label>
    <select id="ord" aria-label="Ordenar"><option value="cat">Destacados</option><option value="asc">Menor precio</option><option value="desc">Mayor precio</option><option value="az">A – Z</option></select>
  </div>
  <div class="chips" id="chips"></div>
</div></div>

<main><p class="count" id="count"></p><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>No hay productos con ese filtro.</div></main>

<footer>Precios en bolivianos. El equivalente en pesos argentinos es una referencia calculada con la cotización del momento y puede variar. Consulta disponibilidad por WhatsApp.</footer>

<a class="wa" id="wa" href="#" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">
  <svg viewBox="0 0 32 32"><path d="M16.003 3C8.83 3 3 8.83 3 16c0 2.29.6 4.52 1.74 6.49L3 29l6.7-1.7A12.96 12.96 0 0 0 16 29c7.17 0 13-5.83 13-13S23.17 3 16.003 3Zm0 23.7c-1.95 0-3.86-.53-5.53-1.52l-.4-.24-3.98 1.01 1.06-3.88-.26-.4A10.66 10.66 0 0 1 5.3 16C5.3 10.1 10.1 5.3 16 5.3S26.7 10.1 26.7 16s-4.8 10.7-10.7 10.7Zm5.87-8c-.32-.16-1.9-.94-2.2-1.04-.3-.11-.5-.16-.72.16-.21.32-.83 1.04-1.02 1.26-.19.21-.37.24-.7.08-.32-.16-1.36-.5-2.59-1.6-.96-.85-1.6-1.9-1.79-2.22-.19-.32-.02-.5.14-.66.14-.14.32-.37.48-.56.16-.19.21-.32.32-.54.1-.21.05-.4-.03-.56-.08-.16-.72-1.74-.99-2.38-.26-.62-.52-.54-.72-.55h-.61c-.21 0-.56.08-.85.4-.29.32-1.12 1.1-1.12 2.68s1.15 3.11 1.31 3.32c.16.21 2.26 3.45 5.48 4.84.77.33 1.36.53 1.83.68.77.24 1.47.21 2.02.13.62-.09 1.9-.78 2.17-1.53.27-.75.27-1.4.19-1.53-.08-.13-.3-.21-.62-.37Z"/></svg>
</a>

<script>
/* ====== CONFIGURACIÓN ======
   Número de WhatsApp con código de país y sin signos (Bolivia 591, Argentina 54). Ej: "59171234567" */
const WHATSAPP = "5493875541862";
const FALLBACK={arsUsd:1766.44,bobUsd:12};
let R={...FALLBACK},P=[],cat="Todos",q="",ord="cat";
const fmtBs=n=>"Bs "+n.toLocaleString("es-BO",{maximumFractionDigits:2});
const fmtArs=n=>"AR$ "+Math.round(n).toLocaleString("es-AR");
const norm=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const mid=d=>(d.compra+d.venta)/2;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
function waLink(msg){return "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg)}
const WA_ICON='<svg viewBox="0 0 32 32"><path d="M16 3C8.8 3 3 8.8 3 16c0 2.3.6 4.5 1.7 6.5L3 29l6.7-1.7A13 13 0 0 0 16 29c7.2 0 13-5.8 13-13S23.2 3 16 3Zm5.9 15.7c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.3-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.2-.2-.3 0-.5.1-.7l.5-.6c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.6-.1-.2-.7-1.7-1-2.4-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1.1-1.1 2.7s1.2 3.1 1.3 3.3c.2.2 2.3 3.5 5.5 4.8.8.3 1.4.5 1.8.7.8.2 1.5.2 2 .1.6-.1 1.9-.8 2.2-1.5.3-.8.3-1.4.2-1.5-.1-.1-.3-.2-.6-.4Z"/></svg>';
async function rates(){
  try{
    const [a,b]=await Promise.all([fetch("https://dolarapi.com/v1/dolares/cripto").then(r=>r.json()),fetch("https://bo.dolarapi.com/v1/dolares/binance").then(r=>r.json())]);
    R={arsUsd:mid(a),bobUsd:mid(b)};
  }catch(e){}
  document.getElementById("fx").innerHTML=`Cotización: <b>1 Bs = AR$ ${(R.arsUsd/R.bobUsd).toFixed(2).replace(".",",")}</b>`;
  render();
}
function render(){
  const t=norm(q);
  let L=P.filter(p=>(cat==="Todos"||p.c===cat)&&(!t||norm(p.n).includes(t)||String(p.cod).includes(t)));
  if(ord==="cat")L.sort((a,b)=>(a.pg-b.pg)||(a.p-b.p));
  else if(ord==="asc")L.sort((a,b)=>(a.bs??Infinity)-(b.bs??Infinity));
  else if(ord==="desc")L.sort((a,b)=>(b.bs??-1)-(a.bs??-1));
  else if(ord==="az")L.sort((a,b)=>a.n.localeCompare(b.n,"es"));
  document.getElementById("count").textContent=L.length+(L.length===1?" producto":" productos");
  document.getElementById("empty").hidden=L.length>0;
  document.getElementById("grid").innerHTML=L.map(p=>{
    const bs=p.bs!=null?`<div><span class="bs">${fmtBs(p.bs)}</span>${p.bn?`<span class="old">${fmtBs(p.bn)}</span>`:""}</div><div class="ars">≈ <b>${fmtArs(p.bs/R.bobUsd*R.arsUsd)}</b></div>`:`<div class="ars">Consultar precio</div>`;
    const dos=/2x1/i.test(p.n)?`<span class="note">2x1 · precio por 2</span>`:"";
    const ask=WHATSAPP?`<a class="ask" target="_blank" rel="noopener" href="${waLink("Hola, me interesa: "+p.n+" (cód. "+p.cod+")")}">${WA_ICON}Consultar</a>`:"";
    return `<article class="card"><div class="ph ${p.pg?"alt":""}"><img loading="lazy" decoding="async" src="${p.img}" alt="${esc(p.n)}"></div><div class="body"><span class="cat">${esc(p.c)}</span><div class="nm">${esc(p.n)}</div><div class="prices">${bs}${dos}</div>${ask}</div></article>`}).join("");
}
(async()=>{
  document.getElementById("wa").href=waLink("Hola, quiero consultar por productos Yanbal");
  P=await fetch("productos.json").then(r=>r.json());
  const cats=["Todos",...new Set(P.map(p=>p.c))];
  const chips=document.getElementById("chips");
  chips.innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c==="Todos"}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  chips.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;chips.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));render();window.scrollTo({top:document.querySelector(".bar").offsetTop,behavior:"smooth"})};
  document.getElementById("q").oninput=e=>{q=e.target.value;render()};
  document.getElementById("ord").onchange=e=>{ord=e.target.value;render()};
  render();rates();
})();
</script>
</body>
</html>
